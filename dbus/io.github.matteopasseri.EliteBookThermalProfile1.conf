<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Anyone may call the EliteBook thermal profile front end; whether a call
  changes anything is decided by polkit, action
  io.github.matteopasseri.EliteBookThermalProfile1.set-profile.
-->
<busconfig>
  <policy user="root">
    <allow own="io.github.matteopasseri.EliteBookThermalProfile1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.matteopasseri.EliteBookThermalProfile1"
           send_interface="io.github.matteopasseri.EliteBookThermalProfile1"/>
    <allow send_destination="io.github.matteopasseri.EliteBookThermalProfile1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.matteopasseri.EliteBookThermalProfile1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
