name: Debian packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RYZENADJ_VERSION: "0.17.0"
  RYZENADJ_SHA256: "848ac9d86ff65d30f5e2c8600aac2613f0f10003b0d6f0e516a54761d7345d44"
  # ryzen_smu has no release tags, so it is pinned by commit; the Debian
  # changelog version names the same commit.
  RYZEN_SMU_COMMIT: "d2983668300dd2a598e5a7dc40e71ce0678cc270"

jobs:
  build:
    name: Build and verify .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the build platform
        run: |
          . /etc/os-release
          echo "Building on ${PRETTY_NAME}"
          echo "UBUNTU_SUFFIX=ubuntu${VERSION_ID}" >>"$GITHUB_ENV"

      - name: Install packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake debhelper fakeroot g++ libpci-dev lintian make

      - name: Build elitebook-thermal-profile
        run: |
          cp -a packaging/debian debian
          dpkg-buildpackage -us -uc -b
          rm -rf debian
          mkdir -p dist
          mv ../*.deb dist/

      - name: Build ryzenadj
        run: |
          curl -L --fail --show-error --output ryzenadj.tar.gz \
            "https://github.com/FlyGoat/RyzenAdj/archive/refs/tags/v${RYZENADJ_VERSION}.tar.gz"
          printf '%s  %s\n' "$RYZENADJ_SHA256" ryzenadj.tar.gz | sha256sum -c -
          tar -xf ryzenadj.tar.gz
          cp -a packaging/debian-ryzenadj "RyzenAdj-${RYZENADJ_VERSION}/debian"
          # win32 sources are irrelevant here and only slow the build down
          rm -rf "RyzenAdj-${RYZENADJ_VERSION}/win32"
          # RyzenAdj is compiled, so the binary is tied to the release it was
          # built on. Tag the version with that release rather than shipping an
          # unlabelled .deb that users cannot tell apart.
          sed -i "1s/(${RYZENADJ_VERSION}-1)/(${RYZENADJ_VERSION}-1~${UBUNTU_SUFFIX})/" \
            "RyzenAdj-${RYZENADJ_VERSION}/debian/changelog"
          (cd "RyzenAdj-${RYZENADJ_VERSION}" && dpkg-buildpackage -us -uc -b)
          mv ./*.deb dist/

      - name: Lintian
        run: |
          lintian --fail-on error --tag-display-limit 0 dist/*.deb

      - name: Install and verify on a real Ubuntu system
        run: |
          set -euo pipefail
          # The GNOME indicator needs gnome-shell, which a runner does not have,
          # so its contents are inspected rather than installed.
          sudo apt-get install -y ./dist/ryzenadj_*.deb ./dist/elitebook-thermal-profile_*.deb

          echo "--- files landed in distribution paths ---"
          test -x /usr/bin/elitebook-thermal-profile
          test -x /usr/bin/elitebook-power-guard
          test -f /usr/lib/elitebook-thermal-profile/elitebook_common.py
          test -f /usr/lib/elitebook-thermal-profile/elitebook_profiles.py
          test -f /usr/lib/elitebook-thermal-profile/elitebook_engine.py
          test ! -e /usr/bin/elitebook_common.py
          test -f /usr/lib/systemd/system/elitebook-thermal-profile.service
          test -f /usr/lib/systemd/system/elitebook-power-guard.timer

          echo "--- the D-Bus front end and its policy files ---"
          dbus_name=io.github.matteopasseri.EliteBookThermalProfile1
          test -x /usr/libexec/elitebook-thermal-profile-dbus
          test -f /usr/lib/systemd/system/elitebook-thermal-profile-dbus.service
          test -f "/usr/share/dbus-1/system.d/${dbus_name}.conf"
          test -f "/usr/share/dbus-1/system-services/${dbus_name}.service"
          test -f "/usr/share/polkit-1/actions/${dbus_name}.policy"
          grep -q "^ExecStart=/usr/libexec/elitebook-thermal-profile-dbus$" \
            /usr/lib/systemd/system/elitebook-thermal-profile-dbus.service
          # Started on demand only: installing must not have started it.
          if [ "$(systemctl is-active elitebook-thermal-profile-dbus.service 2>/dev/null || true)" = "active" ]; then
            echo "the D-Bus front end must not be started by package installation" >&2
            exit 1
          fi

          echo "--- the hibernate preflight must not ship here ---"
          test ! -e /usr/bin/elitebook-hibernate-preflight

          echo "--- source-installer paths were rewritten ---"
          grep -q "/usr/bin/elitebook-thermal-profile" /usr/lib/systemd/system/elitebook-thermal-profile.service
          if grep -rqE "/usr/local/(sbin|libexec)" /usr/bin/elitebook-power-guard \
            /usr/lib/systemd/system/elitebook-*.service; then
            echo "a /usr/local path survived packaging" >&2
            exit 1
          fi

          echo "--- units ship inert: installing must not tune hardware ---"
          for unit in elitebook-thermal-profile.service elitebook-power-guard.timer; do
            state="$(systemctl is-enabled "$unit" 2>/dev/null || true)"
            if [ "$state" != "disabled" ]; then
              echo "$unit should ship disabled, got '${state:-unknown}'" >&2
              exit 1
            fi
            active="$(systemctl is-active "$unit" 2>/dev/null || true)"
            if [ "$active" = "active" ]; then
              echo "$unit must not be started by package installation" >&2
              exit 1
            fi
          done

          echo "--- profile overrides survive upgrades ---"
          # The whole point of shipping profiles.conf is that user edits are
          # not overwritten. dpkg only guarantees that for registered
          # conffiles, so assert it is one rather than assuming.
          test -f /etc/elitebook-thermal-profile/profiles.conf
          dpkg-query -W -f='${Conffiles}\n' elitebook-thermal-profile |
            grep -q "/etc/elitebook-thermal-profile/profiles.conf"
          # It must also be inert as shipped: every line commented out.
          if grep -qE "^[^#]" /etc/elitebook-thermal-profile/profiles.conf; then
            echo "the shipped profiles.conf has active lines; it must do nothing until edited" >&2
            exit 1
          fi
          elitebook-thermal-profile --version

          echo "--- status works without root ---"
          # This step runs as the unprivileged runner user, so invoking it
          # directly is the unprivileged case.
          test "$(id -u)" -ne 0
          elitebook-thermal-profile status >/dev/null

          echo "--- ryzenadj runs ---"
          ryzenadj --help >/dev/null

          echo "--- the dispatcher refuses unsupported hardware ---"
          if elitebook-thermal-profile --check-hardware >/dev/null 2>&1; then
            echo "hardware guard passed on a GitHub runner, which is not an EliteBook" >&2
            exit 1
          fi

          echo "--- the power guard reports the sysfs-only backend here ---"
          # check exits non-zero on a runner (no amd-pstate, no dispatcher
          # state), so capture the output instead of piping under pipefail.
          guard_output="$(elitebook-power-guard check 2>&1 || true)"
          echo "$guard_output" | grep -q "no tuned backend configured"

          echo "--- GNOME indicator package contents ---"
          dpkg -c dist/gnome-shell-extension-elitebook-thermal-profile_*.deb |
            grep -q "usr/share/gnome-shell/extensions/elitebook-thermal-profile@matteopasseri.github.io/extension.js"
          dpkg -c dist/gnome-shell-extension-elitebook-thermal-profile_*.deb |
            grep -q "usr/share/gnome-shell/extensions/elitebook-thermal-profile@matteopasseri.github.io/profileSwitcher.js"

          echo "--- the indicator points at the packaged dispatcher ---"
          # The extension calls the dispatcher by absolute path, so a missed
          # rewrite here would leave a panel menu that silently does nothing.
          ext_js="$(mktemp -d)/extension.js"
          dpkg-deb --fsys-tarfile dist/gnome-shell-extension-elitebook-thermal-profile_*.deb |
            tar -xO ./usr/share/gnome-shell/extensions/elitebook-thermal-profile@matteopasseri.github.io/extension.js \
            >"$ext_js"
          grep -q "'/usr/bin/elitebook-thermal-profile'" "$ext_js"
          if grep -q "/usr/local/sbin" "$ext_js"; then
            echo "the GNOME extension still points at /usr/local/sbin" >&2
            exit 1
          fi

          echo "--- installing the package warns about a source install ---"
          sudo install -D -m 0755 /bin/true /usr/local/sbin/elitebook-thermal-profile
          # dpkg --configure is a no-op on an already configured package, so
          # run the maintainer script directly to exercise the warning.
          # Capture the output rather than piping it: grep -q closes the pipe
          # on the first match, and under pipefail the resulting SIGPIPE would
          # look like a failure even when the warning was printed.
          postinst_output="$(sudo /var/lib/dpkg/info/elitebook-thermal-profile.postinst configure 2>&1 || true)"
          sudo rm -f /usr/local/sbin/elitebook-thermal-profile
          if ! echo "$postinst_output" | grep -q "a source installation is also present"; then
            echo "the package did not warn about the coexisting source install" >&2
            echo "postinst said: $postinst_output" >&2
            exit 1
          fi

      - name: Verify removal is clean
        run: |
          set -euo pipefail
          sudo apt-get purge -y elitebook-thermal-profile
          test ! -e /usr/bin/elitebook-thermal-profile
          test ! -e /usr/lib/systemd/system/elitebook-thermal-profile.service
          test ! -e /usr/libexec/elitebook-thermal-profile-dbus
          test ! -e /usr/share/polkit-1/actions/io.github.matteopasseri.EliteBookThermalProfile1.policy
          test ! -e /usr/share/dbus-1/system.d/io.github.matteopasseri.EliteBookThermalProfile1.conf

      - uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: dist/*.deb
          if-no-files-found: error

  ryzenadj-next:
    # The runner image trails the current Ubuntu release, and RyzenAdj is
    # compiled, so a binary built on the runner is not automatically the right
    # one for a newer release. Build and smoke-test it there too.
    name: Build ryzenadj on Ubuntu 26.04
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install packaging tooling
        run: |
          apt-get update
          # build-essential is an implicit build dependency of every Debian
          # package; dpkg-checkbuilddeps refuses to start without it.
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl debhelper dpkg-dev \
            fakeroot g++ git libpci-dev make tar

      - uses: actions/checkout@v4

      - name: Confirm the build platform
        run: |
          . /etc/os-release
          echo "Building on ${PRETTY_NAME}"
          case "${VERSION_ID}" in
            26.04) ;;
            *) echo "expected Ubuntu 26.04, got ${VERSION_ID}" >&2; exit 1 ;;
          esac

      - name: Build ryzenadj
        run: |
          curl -L --fail --show-error --output ryzenadj.tar.gz \
            "https://github.com/FlyGoat/RyzenAdj/archive/refs/tags/v${RYZENADJ_VERSION}.tar.gz"
          printf '%s  %s\n' "$RYZENADJ_SHA256" ryzenadj.tar.gz | sha256sum -c -
          tar -xf ryzenadj.tar.gz
          cp -a packaging/debian-ryzenadj "RyzenAdj-${RYZENADJ_VERSION}/debian"
          rm -rf "RyzenAdj-${RYZENADJ_VERSION}/win32"
          sed -i "1s/(${RYZENADJ_VERSION}-1)/(${RYZENADJ_VERSION}-1~ubuntu26.04)/" \
            "RyzenAdj-${RYZENADJ_VERSION}/debian/changelog"
          (cd "RyzenAdj-${RYZENADJ_VERSION}" && dpkg-buildpackage -us -uc -b)
          mkdir -p dist
          mv ./*.deb dist/

      - name: Install and verify the binary runs
        run: |
          set -eu
          apt-get install -y ./dist/ryzenadj_*.deb
          ryzenadj --help >/dev/null
          # A missing shared library would surface here rather than on a user's
          # laptop the first time a profile is applied.
          ldd /usr/bin/ryzenadj

      - uses: actions/upload-artifact@v4
        with:
          name: ryzenadj-ubuntu-26.04
          path: dist/*.deb
          if-no-files-found: error

  ryzen-smu-dkms:
    # The module is compiled on the user's machine, by DKMS, for each kernel,
    # so the package is checked by installing it and letting DKMS build the
    # module against the kernel each release ships.
    name: Build ryzen-smu-dkms on Ubuntu ${{ matrix.release }}
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.release }}
    strategy:
      fail-fast: false
      matrix:
        release: ["24.04", "26.04"]
    steps:
      - name: Install packaging tooling and the release's kernel headers
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates debhelper dh-dkms dkms dpkg-dev \
            fakeroot git kmod lintian linux-headers-generic

      - uses: actions/checkout@v4
        with:
          path: tuning

      - name: Fetch ryzen_smu at the pinned commit
        run: |
          set -eu
          git init -q ryzen_smu
          git -C ryzen_smu fetch -q --depth 1 https://github.com/amkillam/ryzen_smu "$RYZEN_SMU_COMMIT"
          git -C ryzen_smu checkout -q FETCH_HEAD
          test "$(git -C ryzen_smu rev-parse HEAD)" = "$RYZEN_SMU_COMMIT"
          short="$(printf '%s' "$RYZEN_SMU_COMMIT" | cut -c1-7)"
          if ! head -n 1 tuning/packaging/debian-ryzen-smu-dkms/changelog | grep -q "\.${short}-"; then
            echo "the Debian changelog version does not name commit ${short}" >&2
            exit 1
          fi

      - name: Build ryzen-smu-dkms
        run: |
          cp -a tuning/packaging/debian-ryzen-smu-dkms ryzen_smu/debian
          (cd ryzen_smu && dpkg-buildpackage -us -uc -b)
          mkdir -p dist
          mv ./*.deb dist/

      - name: Lintian
        run: lintian --fail-on error --tag-display-limit 0 dist/*.deb

      - name: Install and let DKMS build the module
        run: |
          set -eu
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/ryzen-smu-dkms_*.deb
          kernel="$(ls /usr/src | sed -n 's/^linux-headers-\(.*-generic\)$/\1/p' | sort -V | tail -n 1)"
          echo "kernel headers: $kernel"
          dkms status
          # The postinst builds for every kernel with headers; build here
          # too in case it skipped this one, then demand an installed module.
          dkms install -m ryzen_smu -v "$(dpkg-query -W -f='${Version}' ryzen-smu-dkms | sed 's/-[^-]*$//')" -k "$kernel" || true
          dkms status | grep -E "ryzen_smu/.*, ${kernel}, .*: installed"
          module="$(find "/lib/modules/${kernel}" -name 'ryzen_smu.ko*' | head -n 1)"
          test -n "$module"
          # RyzenAdj only uses the module at 0.1.6 or later in the 0.1 series.
          modinfo -F version "$module" | grep -Eq '^0\.1\.([6-9]|[1-9][0-9]+)$'
          test -f /usr/lib/modules-load.d/ryzen_smu.conf

      - name: Verify removal is clean
        run: |
          set -eu
          DEBIAN_FRONTEND=noninteractive apt-get purge -y ryzen-smu-dkms
          test -z "$(find /lib/modules -name 'ryzen_smu.ko*')"
          test ! -e /usr/lib/modules-load.d/ryzen_smu.conf

      # Architecture independent: one copy is enough for the release.
      - uses: actions/upload-artifact@v4
        if: matrix.release == '24.04'
        with:
          name: ryzen-smu-dkms
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Attach packages to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ryzenadj-next, ryzen-smu-dkms]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find artifacts -name "*.deb" -print
          # shellcheck disable=SC2046
          gh release upload "${GITHUB_REF_NAME}" $(find artifacts -name "*.deb") --clobber
