name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check for local machine paths
        run: tests/check-no-local-paths.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -e SC1091 -x
        with:
          severity: warning
          ignore_paths: >-
            .git
            gnome-extension

  systemd:
    name: systemd unit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify units
        run: tests/verify-systemd-units.sh
      - name: Check security exposure
        run: tests/check-systemd-security.sh

  shell-tests:
    name: Shell unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shell tests
        run: tests/test-hardware-guard.sh
      - name: Run hibernate preflight tests
        run: tests/test-hibernate-preflight.sh
      - name: Run platform detection tests
        run: tests/test-platform-detection.sh
      - name: Run SMU fallback tests
        run: tests/test-smu-fallback.sh
      - name: Run profile configuration tests
        run: tests/test-profile-config.sh
      - name: Run version consistency tests
        run: tests/test-version-consistency.sh
      - name: Run thermal report tests
        run: tests/test-thermal-report.sh

  ruff:
    name: Ruff (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install --no-cache-dir ruff==0.6.9
      - name: Lint
        run: |
          ruff check \
            src/elitebook-thermal-profile \
            src/elitebook_common.py \
            src/elitebook-idle-watcher \
            src/elitebook-steam-game-watcher \
            src/elitebook-power-guard \
            src/elitebook-hibernate-preflight \
            system-sleep/elitebook-thermal-profile \
            tests
      - name: Format check
        run: |
          ruff format --check \
            src/elitebook-thermal-profile \
            src/elitebook_common.py \
            src/elitebook-idle-watcher \
            src/elitebook-steam-game-watcher \
            src/elitebook-power-guard \
            src/elitebook-hibernate-preflight \
            system-sleep/elitebook-thermal-profile \
            tests

  python-syntax:
    name: Python typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: pip install --no-cache-dir mypy==1.18.2 pytest==8.4.2
      - name: Compile Python sources
        run: |
          python3 -m py_compile \
            src/elitebook-thermal-profile \
            src/elitebook_common.py \
            src/elitebook-idle-watcher \
            src/elitebook-steam-game-watcher \
            src/elitebook-power-guard \
            src/elitebook-hibernate-preflight \
            system-sleep/elitebook-thermal-profile \
            tests/test_idle_watcher.py \
            tests/test_steam_game_watcher.py \
            tests/test_power_guard.py \
            tests/test_hibernate_preflight.py
      - name: Typecheck Python sources
        run: |
          mypy --strict --scripts-are-modules \
            src/elitebook-thermal-profile \
            src/elitebook_common.py \
            src/elitebook-idle-watcher \
            src/elitebook-steam-game-watcher \
            src/elitebook-power-guard \
            src/elitebook-hibernate-preflight
          # The sleep hook shares its filename with the dispatcher, so it is
          # typechecked on its own to avoid a duplicate module name.
          mypy --strict system-sleep/elitebook-thermal-profile
      - name: Run unit tests
        run: pytest -q
